services:
  - type: web
    name: ammi-abbu-ka-sacha-beta
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: BOSS_ID
        sync: false
      - key: BOSS_SECRET
        sync: false
      - key: PRO_MINIAPP_URL
        sync: false
      - key: PRO_VAULT_KEY
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: PRO_ENABLE_CHECKOUT
        value: "0"
      - key: SWIGGY_BLOCK_LIVE_ORDER_PLACE
        value: "1"
      - key: SIMPLE_CHAT_MODE
        value: "1"
      - key: HEADLESS
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium"

    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
